<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#2F81F7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060A17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.5" />

  <!-- Outer Cyber Shield -->
  <path d="M 32 10 L 48 16 C 48 32 40 46 32 54 C 24 46 16 32 16 16 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Cyber Core -->
  <path d="M 32 16 L 43 20 C 43 31 37 41 32 47 C 27 41 21 31 21 20 Z" 
        fill="rgba(0, 240, 255, 0.08)" 
        stroke="#00F0FF" 
        stroke-width="1.2" 
        stroke-opacity="0.6" />

  <!-- Digital Lock / Node -->
  <circle cx="32" cy="29" r="4.5" fill="#00F0FF" />
  <path d="M 32 33.5 L 32 39" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="40" r="1.5" fill="#00F0FF" />

  <!-- Crosshair Reticle Accents -->
  <line x1="12" y1="32" x2="16" y2="32" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="32" x2="52" y2="32" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
